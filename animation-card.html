<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.body{
     display: grid;
    align-items: center;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 100px;
}
.continer{
    animation-name: move;
    animation-duration: 10s;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    animation-direction: alternate;
    border: 2px solid rgb(201, 201, 253);
    height: 600px;
    width: 400px;
    border-radius: 20px;
    box-shadow: 10px 10px 10px rgb(223, 223, 255);
    background-color:  rgb(241, 241, 254);
    color: rgb(140, 140, 254) ;
    align-content: center;
    justify-items: center;
    display: grid;
    font-size: x-large;
}
@keyframes move {
  0% {
    transform: translateX(0);
  }

  to {
    transform: translateX(200px);
  }
}
@keyframes change {
  0% {
    transform: rotate(0deg);
  }

  to {
     transform: rotate(180deg);
      background-color:  rgb(254, 234, 220);
      border: 2px solid  rgb(255, 206, 171) ;
       box-shadow: 10px 10px 10px  rgb(253, 224, 203);
       color:  rgb(255, 168, 107) ;
  }
}
.continer:hover{
 animation-name: change;
  animation: change alternate ease-in-out infinite  3s;
}
@media (prefers-reduced-motion: reduce) {
  .continer {
    animation: none;
    transform: none;
  }
}

</style>
<body class="body">
    <header>The Magic Car</header>
    <div class="continer">
       Magic Car
       <br> <br><br>
       Hover me
    </div>
</body>
</html>
