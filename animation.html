<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.continer{
    height: 100vm;
    width: 100vm;
    display: grid;
    align-items: center;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 70px;
}
.box1{
    border: 2px solid darkgrey;
    border-radius: 50%;
    background-color:darkgrey ;
    height: 200px;
    width: 200px;
    align-items: center;
    transition: 4s;
}
.box1:hover {
   transform: translateX(400px);
   

   
}
.box2{
    border: 2px solid darkgrey;
    border-radius: 20px;
    background-color:darkgrey ;
    height: 200px;
    width: 200px;
    align-items: center;
    transition: 4s;
    
    
}
.box2:hover {
   transform: rotate(180deg);
}
.box3{
    border: 2px solid darkgrey;
    border-radius: 20px;
    background-color:darkgrey ;
    height: 200px;
    width: 200px;
    align-items: center;
    transition: 4s;
    transform: skew(20deg);
    
}
.box3:hover {
   background-color:rgb(221, 221, 221) ;
}
.box4{
   
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-bottom: 200px solid darkgrey;
    transition: 4s;
    align-items: center;
    transition: 4s;
    
    
}
.box4:hover {
      transform: scale(1.5);
}
</style>
<body>
    <div class="continer">
        <div class=" box1"></div>
        <div class=" box2"></div>
        <div class=" box3"></div>
        <div class=" box4"></div>
    </div>
</body>
</html>
